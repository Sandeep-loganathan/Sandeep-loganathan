<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7c5ff5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <!-- Border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f8ef7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle glow for bg circle -->
    <filter id="outerGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer ring glow -->
  <circle cx="100" cy="100" r="97" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.4" filter="url(#outerGlow)"/>

  <!-- Main background circle -->
  <circle cx="100" cy="100" r="94" fill="url(#bgGrad)"/>

  <!-- Decorative inner ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#borderGrad)" stroke-width="1" opacity="0.6"/>

  <!-- Corner accent dots -->
  <circle cx="100" cy="16" r="3" fill="#4f8ef7" opacity="0.8"/>
  <circle cx="100" cy="184" r="3" fill="#a855f7" opacity="0.8"/>
  <circle cx="16" cy="100" r="3" fill="#7c5ff5" opacity="0.8"/>
  <circle cx="184" cy="100" r="3" fill="#7c5ff5" opacity="0.8"/>

  <!-- Main Initials Text -->
  <text
    x="100"
    y="122"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="68"
    font-weight="800"
    fill="url(#textGrad)"
    text-anchor="middle"
    letter-spacing="-2"
    filter="url(#glow)"
  >SL</text>

  <!-- Underline accent bar -->
  <rect x="62" y="128" width="76" height="3" rx="1.5" fill="url(#borderGrad)" opacity="0.85"/>

  <!-- Tagline text -->
  <text
    x="100"
    y="152"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="9.5"
    font-weight="400"
    fill="#8899bb"
    text-anchor="middle"
    letter-spacing="2.5"
  >EMBEDDED · AI · IoT</text>

  <!-- Small decorative top tag -->
  <text
    x="100"
    y="58"
    font-family="'Segoe UI', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="8"
    font-weight="300"
    fill="#5a6a8a"
    text-anchor="middle"
    letter-spacing="1.5"
  >SANDEEP L.</text>
</svg>

